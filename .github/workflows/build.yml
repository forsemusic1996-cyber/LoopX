name: Build MiniSampler VST3

on:
  workflow_dispatch:
  push:
    branches: [ main ]

concurrency:
  group: MiniSampler-main
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Download JUCE
        shell: pwsh
        run: git clone --depth 1 https://github.com/juce-framework/JUCE.git JUCE

      - name: Configure
        shell: pwsh
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64 -DJUCE_DIR="$env:GITHUB_WORKSPACE\JUCE"

      - name: Build VST3 with symbols and checks
        shell: pwsh
        run: cmake --build build --config RelWithDebInfo --parallel

      - name: Check drag-drop, state, tempo sync and live resize
        shell: pwsh
        run: ctest --test-dir build -C RelWithDebInfo --output-on-failure

      - name: Package VST3 and dependency licenses
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path package -Force | Out-Null
          $bundles = Get-ChildItem -Path build -Filter "*.vst3" -Directory -Recurse | Where-Object { $_.Parent.Name -eq "VST3" -and $_.Parent.Parent.Name -eq "RelWithDebInfo" }
          if (-not $bundles) { throw "No VST3 bundle found" }
          foreach ($bundle in $bundles) {
            Copy-Item -LiteralPath $bundle.FullName -Destination package -Recurse
            $resources = Join-Path (Join-Path package $bundle.Name) "Contents/Resources"
            New-Item -ItemType Directory -Path $resources -Force | Out-Null
            Copy-Item -Path build/Signalsmith-*-LICENSE.txt -Destination $resources
          }

      - name: Upload VST3 artifact
        uses: actions/upload-artifact@v4
        with:
          name: MiniSampler-VST3
          path: package/*.vst3
          if-no-files-found: error

      - name: Upload debug symbols
        uses: actions/upload-artifact@v4
        with:
          name: MiniSampler-symbols
          path: build/**/*.pdb
          if-no-files-found: error
